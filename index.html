
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cajas Digitales</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <header class="encabezado">
            <h1>Cajas Digitales</h1>
            <p>Organiza tu información de manera sencilla.</p>
        </header>

        <section class="acciones">

            <button id="agregarCaja">
                + Crear nueva caja
            </button>

            <p>
                Cajas creadas: <span id="contador">0</span>
            </p>

        </section>

        <section class="cajas" id="cajas">

            <p class="vacio">
                Todavía no tienes cajas creadas.
            </p>

        </section>

    </main>

</body>

</html>
